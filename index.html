<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#06070a" />
    <meta
      name="description"
      content="القفل الأول من لعبة الخزنة العنيدة: أوصل المزلاج إلى العلامة واثبت حتى يكتمل القفل."
    />
    <title>الخزنة العنيدة — المزلاج الكتوم</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2306080b'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23c9a86a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23c9a86a'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>

  <body>
    <main class="app" id="app" data-phase="idle">
      <div class="vault" aria-hidden="true">
        <span class="rivet rivet--tl"></span>
        <span class="rivet rivet--tr"></span>
        <span class="rivet rivet--bl"></span>
        <span class="rivet rivet--br"></span>
        <span class="vault__seam"></span>
      </div>

      <header class="masthead">
        <p class="masthead__brand" data-string="gameTitle"></p>
        <h1 class="masthead__title">
          <span class="masthead__lock" data-string="lockKicker"></span>
          <span class="masthead__dot" aria-hidden="true">·</span>
          <span class="masthead__name" data-string="lockName"></span>
        </h1>
      </header>

      <div class="notice" id="notice" role="status" aria-live="polite" aria-atomic="true">
        <div class="notice__plate">
          <p class="notice__text" id="noticeText"></p>
        </div>
      </div>

      <section class="rig-wrap">
        <div
          class="rig"
          id="rig"
          tabindex="0"
          role="slider"
          aria-label="مزلاج القفل الأول"
          aria-describedby="rigHelp"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-valuetext=""
        >
          <svg class="rig__svg" viewBox="0 0 1000 300" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#8b939a" />
                <stop offset="0.12" stop-color="#c3c9ce" />
                <stop offset="0.42" stop-color="#838b92" />
                <stop offset="0.66" stop-color="#656d74" />
                <stop offset="1" stop-color="#3a4047" />
              </linearGradient>

              <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff" stop-opacity="0.34" />
                <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
              </linearGradient>

              <radialGradient id="brass" cx="0.35" cy="0.3" r="0.8">
                <stop offset="0" stop-color="#f0d7a2" />
                <stop offset="0.5" stop-color="#c9a86a" />
                <stop offset="1" stop-color="#7c6431" />
              </radialGradient>

              <linearGradient id="brassLine" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7d6535" />
                <stop offset="0.5" stop-color="#e6c98e" />
                <stop offset="1" stop-color="#8d7442" />
              </linearGradient>

              <linearGradient id="plateFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#12171d" />
                <stop offset="0.5" stop-color="#0d1116" />
                <stop offset="1" stop-color="#080b0e" />
              </linearGradient>

              <linearGradient id="grooveFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#000000" />
                <stop offset="0.3" stop-color="#070a0d" />
                <stop offset="0.78" stop-color="#0e1217" />
                <stop offset="1" stop-color="#171c22" />
              </linearGradient>

              <linearGradient id="grooveShade" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#000000" stop-opacity="0.95" />
                <stop offset="1" stop-color="#000000" stop-opacity="0" />
              </linearGradient>

              <radialGradient id="targetGlow">
                <stop offset="0" stop-color="#e0b577" stop-opacity="0.26" />
                <stop offset="0.6" stop-color="#c9a86a" stop-opacity="0.09" />
                <stop offset="1" stop-color="#c9a86a" stop-opacity="0" />
              </radialGradient>

              <radialGradient id="chargeGlow">
                <stop offset="0" stop-color="#e0b577" stop-opacity="0.22" />
                <stop offset="0.55" stop-color="#c9a86a" stop-opacity="0.07" />
                <stop offset="1" stop-color="#c9a86a" stop-opacity="0" />
              </radialGradient>

              <filter id="boltShadow" x="-60%" y="-60%" width="220%" height="240%">
                <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.62" />
              </filter>
            </defs>

            <!-- المسار: صفيحة غائرة وحافة مشطوفة -->
            <g class="rail">
              <rect class="rail__plate" x="56" y="126" width="888" height="88" rx="16" />
              <rect class="rail__lip" x="82" y="144" width="836" height="52" rx="26" />
              <rect class="rail__groove" x="84" y="146" width="832" height="48" rx="24" />
              <rect class="rail__shade" x="84" y="146" width="832" height="22" rx="11" />
              <g class="ticks" id="ticks"></g>
              <g class="start-mark" id="startMark">
                <line x1="756" y1="200" x2="756" y2="210" />
              </g>
            </g>

            <!-- علامة الهدف -->
            <g transform="translate(324 170)">
              <g class="target" id="target">
                <ellipse class="target__glow" cx="0" cy="0" rx="66" ry="31" />
                <path class="target__brace" d="M-48 -44 V44 M48 -44 V44" />
                <path class="target__cap" d="M-48 -44 H-60 M48 -44 H60 M-48 44 H-60 M48 44 H60" />
                <line class="target__axis" x1="0" y1="-40" x2="0" y2="40" />
              </g>
            </g>
            <text class="target__label" id="targetLabel" x="324" y="242" data-string="targetLabel"></text>

            <!-- المزلاج -->
            <g class="bolt" id="bolt" transform="translate(756 170)">
              <circle class="bolt__halo" cx="0" cy="0" r="92" />
              <circle class="bolt__ring-track" cx="0" cy="0" r="58" />
              <circle class="bolt__ring" id="ring" cx="0" cy="0" r="58" transform="rotate(-90)" />
              <g class="bolt__body" filter="url(#boltShadow)">
                <path class="bolt__plate" d="M-30 -30 H30 L40 -20 V20 L30 30 H-30 L-40 20 V-20 Z" />
                <path class="bolt__sheen" d="M-32 -24 H32 L35 -20 V-16 H-35 V-20 Z" />
                <line class="bolt__score" x1="-24" y1="12" x2="24" y2="12" />
                <circle class="bolt__pin" cx="0" cy="0" r="8" />
                <circle class="bolt__pin-core" cx="0" cy="0" r="2.6" />
                <circle class="bolt__stud" cx="-30" cy="0" r="2" />
                <circle class="bolt__stud" cx="30" cy="0" r="2" />
              </g>
            </g>
          </svg>
        </div>

        <p class="guidance" id="guidance" data-string="guidance"></p>
      </section>

      <footer class="foot">
        <button class="sound" id="soundBtn" type="button" aria-pressed="true" data-string="soundOn"></button>
        <p class="foot__hint" data-string="hint"></p>
      </footer>

      <div class="done" id="done" hidden>
        <div class="done__backdrop" id="doneBackdrop"></div>
        <div
          class="done__plate"
          role="dialog"
          aria-modal="true"
          aria-labelledby="doneTitle"
          aria-describedby="doneSub"
        >
          <span class="rivet rivet--tl"></span>
          <span class="rivet rivet--tr"></span>
          <span class="rivet rivet--bl"></span>
          <span class="rivet rivet--br"></span>
          <p class="done__kicker" data-string="lockKicker"></p>
          <h2 class="done__title" id="doneTitle" data-string="completionTitle"></h2>
          <p class="done__sub" id="doneSub" data-string="completionSubtitle"></p>
          <div class="done__rule" aria-hidden="true"></div>
          <p class="done__next" data-string="nextLock"></p>
          <button class="done__btn" id="replayBtn" type="button" data-string="replay"></button>
        </div>
      </div>

      <p class="sr-only" id="rigHelp"></p>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
