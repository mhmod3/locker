<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0b0c" />
    <meta
      name="description"
      content="القفل الأول من لعبة الخزنة العنيدة: أوصل المزلاج إلى العلامة واثبت حتى يكتمل القفل."
    />
    <title>الخزنة العنيدة — المزلاج الكتوم</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0b0c'/%3E%3Cpath d='M6 12h20M6 20h20' stroke='%23d6a33f' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link
      rel="preload"
      href="./assets/fonts/plex-arabic-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./assets/fonts/plex-arabic-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>

  <body>
    <main class="app" id="app" data-phase="idle" data-layout="landscape">
      <div class="frame" aria-hidden="true"></div>

      <header class="topbar">
        <span class="topbar__brand" data-string="gameTitle"></span>
        <span class="topbar__rule" aria-hidden="true"></span>
        <span class="topbar__index" data-string="lockIndex"></span>
      </header>

      <div class="notice-slot">
        <div class="notice" id="notice" role="status" aria-live="polite" aria-atomic="true">
          <p class="notice__text" id="noticeText"></p>
        </div>
      </div>

      <div class="lead">
        <h1 class="lead__title" data-string="lockName"></h1>
      </div>

      <section class="stage">
        <div
          class="rig"
          id="rig"
          tabindex="0"
          role="slider"
          aria-label="مزلاج القفل الأول"
          aria-describedby="rigHelp"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-valuetext=""
        >
          <svg class="rig__svg rig__svg--landscape" data-orientation="landscape" viewBox="0 0 1000 260" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#a7adb2" />
                <stop offset="0.16" stop-color="#cfd4d8" />
                <stop offset="0.5" stop-color="#8f969c" />
                <stop offset="1" stop-color="#5a6066" />
              </linearGradient>
            </defs>

            <g class="bed">
              <rect class="bed__plate" x="52" y="118" width="896" height="100" />
              <line class="bed__edge" x1="52" y1="118.5" x2="948" y2="118.5" />
            </g>

            <rect class="slot" x="96" y="146" width="808" height="48" rx="24" />
            <rect class="slot__bevel" x="97" y="147" width="806" height="46" rx="23" />
            <g class="ticks" id="ticks"></g>

            <g class="target-fill" id="targetFill" transform="translate(324 170)">
              <rect class="target__fill" x="-48" y="-24" width="96" height="48" />
              <line class="target__base" x1="-48" y1="23" x2="48" y2="23" vector-effect="non-scaling-stroke" />
            </g>

            <g class="decoy" id="decoy" transform="translate(600 170)">
              <rect class="decoy__fill" x="-48" y="-24" width="96" height="48" />
              <path
                class="decoy__mark"
                d="M-48 -34 V34 M48 -34 V34 M-58 -34 H-42 M42 -34 H58 M-58 34 H-42 M42 34 H58"
                vector-effect="non-scaling-stroke"
              />
            </g>

            <g class="bolt" id="bolt" transform="translate(756 170)">
              <circle class="bolt__ring" id="ring" cx="0" cy="0" r="54" transform="rotate(-90)" />
              <path
                class="bolt__shadow"
                d="M-28 -28 H28 L36 -20 V20 L28 28 H-28 L-36 20 V-20 Z"
                transform="translate(0 3)"
              />
              <path class="bolt__plate" d="M-28 -28 H28 L36 -20 V20 L28 28 H-28 L-36 20 V-20 Z" />
              <line class="bolt__sheen" x1="-30" y1="-24" x2="30" y2="-24" />
              <g class="bolt__knurl" id="knurl"></g>
              <circle class="bolt__screw" cx="-23" cy="0" r="2.4" />
              <circle class="bolt__screw" cx="23" cy="0" r="2.4" />
            </g>

            <g class="target-marks" id="targetMarks" transform="translate(324 170)">
              <path
                class="target__mark"
                d="M-48 -34 V34 M48 -34 V34 M-58 -34 H-42 M42 -34 H58 M-58 34 H-42 M42 34 H58"
                vector-effect="non-scaling-stroke"
              />
            </g>

            <line class="start-mark" id="startMark" x1="756" y1="200" x2="756" y2="210" />
          </svg>

          <svg
            class="rig__svg rig__svg--portrait"
            data-orientation="portrait"
            viewBox="0 0 340 520"
            aria-hidden="true"
            focusable="false"
          >
            <defs>
              <linearGradient id="steelP" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#cfd4d8" />
                <stop offset="0.2" stop-color="#a7adb2" />
                <stop offset="0.62" stop-color="#8f969c" />
                <stop offset="1" stop-color="#5a6066" />
              </linearGradient>
            </defs>

            <g class="bed">
              <rect class="bed__plate" x="46" y="8" width="248" height="504" />
              <line class="bed__edge" x1="46" y1="8.5" x2="294" y2="8.5" />
            </g>

            <rect class="slot" x="142" y="24" width="56" height="488" rx="28" />
            <rect class="slot__bevel" x="143" y="25" width="54" height="486" rx="27" />
            <g class="ticks"></g>

            <g class="target-fill" transform="translate(170 168)">
              <rect class="target__fill" x="-28" y="-24" width="56" height="48" />
              <line
                class="target__base"
                x1="22"
                y1="-24"
                x2="22"
                y2="24"
                vector-effect="non-scaling-stroke"
              />
            </g>

            <g class="decoy" transform="translate(170 300)">
              <rect class="decoy__fill" x="-28" y="-24" width="56" height="48" />
              <path
                class="decoy__mark"
                d="M-34 -24 H34 M-34 24 H34 M-34 -24 V-32 M-34 24 V32 M34 -24 V-32 M34 24 V32"
                vector-effect="non-scaling-stroke"
              />
            </g>

            <g class="bolt" transform="translate(170 384)">
              <circle class="bolt__ring" cx="0" cy="0" r="58" transform="rotate(-90)" />
              <path
                class="bolt__shadow"
                d="M-28 -42 H28 L36 -34 V34 L28 42 H-28 L-36 34 V-34 Z"
                transform="translate(0 3)"
              />
              <path
                class="bolt__plate"
                fill="url(#steelP)"
                d="M-28 -42 H28 L36 -34 V34 L28 42 H-28 L-36 34 V-34 Z"
              />
              <line class="bolt__sheen" x1="-29" y1="-38" x2="29" y2="-38" />
              <g class="bolt__knurl"></g>
              <circle class="bolt__screw" cx="0" cy="-27" r="2.6" />
              <circle class="bolt__screw" cx="0" cy="27" r="2.6" />
            </g>

            <g class="target-marks" transform="translate(170 168)">
              <path
                class="target__mark"
                d="M-34 -24 H34 M-34 24 H34 M-34 -24 V-32 M-34 24 V32 M34 -24 V-32 M34 24 V32"
                vector-effect="non-scaling-stroke"
              />
            </g>

            <line class="start-mark" x1="204" y1="384" x2="212" y2="384" />
          </svg>
        </div>

        <div class="meter">
          <p class="guidance" id="guidance" data-string="guidance"></p>
          <p class="readout">
            <span class="readout__label" data-string="readout"></span>
            <span class="readout__value" id="readoutValue">٠٪</span>
          </p>
        </div>
      </section>

      <footer class="foot">
        <button class="btn" id="soundBtn" type="button" aria-pressed="true"></button>
        <p class="foot__hint" data-string="hint"></p>
      </footer>

      <div class="done" id="done" hidden>
        <div class="done__scrim" id="doneScrim"></div>
        <div
          class="done__panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="doneTitle"
          aria-describedby="doneSub"
        >
          <p class="done__index" data-string="lockIndex"></p>
          <h2 class="done__title" id="doneTitle" data-string="completionTitle"></h2>
          <p class="done__sub" id="doneSub" data-string="completionSubtitle"></p>
          <p class="done__next" data-string="nextLock"></p>
          <button class="btn btn--wide" id="replayBtn" type="button" data-string="replay"></button>
        </div>
      </div>

      <p class="sr-only" id="rigHelp"></p>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
